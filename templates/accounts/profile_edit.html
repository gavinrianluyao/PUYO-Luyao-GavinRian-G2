{% extends 'base.html' %}

{% block title %}Edit profile | PUYO{% endblock %}

{% block content %}
<section class="card">
    <p class="eyebrow">Account</p>
    <h1>Edit profile</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit">Save changes</button>
            <a class="button button-secondary" href="{% url 'profile' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
