{% extends 'base.html' %}

{% block title %}Confirm Delete | PUYO{% endblock %}

{% block content %}
<section class="card">
    <p class="eyebrow">Confirm Deletion</p>
    <h1>Delete {{ object }}</h1>
    <p>Are you sure you want to delete this record? This action cannot be undone.</p>

    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="button button-danger">Yes, Delete</button>
            <a class="button button-secondary" href="javascript:history.back()">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
