{% extends 'base.html' %}

{% block title %}Assign Room | PUYO{% endblock %}

{% block content %}
<section class="card">
    <p class="eyebrow">Owner Dashboard</p>
    <h1>Assign Student to Room</h1>
    <p>Select a student and an available room to create a new tenancy agreement (BR-013, BR-016, BR-018).</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit">Confirm Assignment</button>
            <a class="button button-secondary" href="{% url 'admin_panel' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
